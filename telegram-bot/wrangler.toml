# IS-1 Telegram bot — Cloudflare Workers config (works with the "Deploy to Cloudflare" button)
name = "instant-sampler-is-1"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Storage for file ids, purchases and settings. No id: wrangler (4.45+) creates the namespace on the first deploy.
[[kv_namespaces]]
binding = "DB"

[vars]
PRICE_USD = "9.99"
SALE_PRICE_USD = "8.99"
SALE_UNTIL = "2027-01-01T00:00:00+03:00"
PROMO_CODES = "salychmusic=7.99"
STARS_PER_USD = "50"
